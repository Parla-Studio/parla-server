# nginx site for the MirraLingua API (TLS via certbot/Let's Encrypt).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lingua.mirranet.de;

    ssl_certificate     /etc/letsencrypt/live/lingua.mirranet.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lingua.mirranet.de/privkey.pem;

    client_max_body_size 512k;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name lingua.mirranet.de;
    return 301 https://$host$request_uri;
}
