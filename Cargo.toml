[package]
name = "parla-server"
version = "2.1.0"
edition = "2021"
rust-version = "1.82"
description = "Backend for the Parla language learning app: accounts, course delivery and progress sync."
license = "MIT"
publish = false

[lib]
name = "parla"
path = "src/lib.rs"

[[bin]]
name = "parla-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "fs"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
filetime = "0.2"
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
