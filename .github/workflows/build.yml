name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  package:
    needs: test
    # Ubuntu 22.04 keeps the glibc requirement low (Debian 12, Ubuntu 22.04+).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          cargo build --release --locked
          deb=$(SKIP_BUILD=1 packaging/build-deb.sh)
          mkdir -p dist
          cp "$deb" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: parla-server-x86_64
          path: dist/*

  content:
    # Copies the course files to the server after a push to main; the server picks them up within seconds.
    # Skipped when the secrets are not configured.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Publish course files
        env:
          CONTENT_TARGET: ${{ secrets.CONTENT_TARGET }}
          CONTENT_PORT: ${{ secrets.CONTENT_PORT }}
          CONTENT_SSH_KEY: ${{ secrets.CONTENT_SSH_KEY }}
          CONTENT_KNOWN_HOSTS: ${{ secrets.CONTENT_KNOWN_HOSTS }}
        run: |
          if [ -z "${CONTENT_TARGET:-}" ]; then
            echo "::notice::Content deploy secrets not set; skipping content publish."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CONTENT_SSH_KEY" > ~/.ssh/id_content
          chmod 600 ~/.ssh/id_content
          printf '%s\n' "$CONTENT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -av --delay-updates \
            -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -p ${CONTENT_PORT:-22} -i $HOME/.ssh/id_content" \
            content/courses/*.json "$CONTENT_TARGET"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: parla-server-*
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          cat > notes.md <<NOTES
          Parla Server ${version}

          | System | File |
          | --- | --- |
          | Debian 12+, Ubuntu 22.04+ (x86_64) | \`parla-server_${version}_amd64.deb\` |

          Installation and update: see the README (apt.mirranet.de).
          NOTES
          sed -i 's/^          //' notes.md
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Parla Server ${version}" --notes-file notes.md

  apt:
    # Publish the release .deb to the MirraNET APT repository (apt.mirranet.de).
    # reprepro and the signing key live on the server; skipped when the deploy
    # secrets are not configured.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: parla-server-*
          merge-multiple: true
      - name: Publish to APT repository
        env:
          APT_HOST: ${{ secrets.APT_HOST }}
          APT_SSH_KEY: ${{ secrets.APT_SSH_KEY }}
          APT_KNOWN_HOSTS: ${{ secrets.APT_KNOWN_HOSTS }}
          APT_REPO: ${{ secrets.APT_REPO }}
          APT_PORT: ${{ secrets.APT_PORT }}
          APT_SUITE: stable
        run: |
          if [ -z "${APT_HOST:-}" ]; then
            echo "::notice::APT deploy secrets not set; skipping APT publish."
            exit 0
          fi
          mkdir -p debs
          find dist -name '*.deb' -exec cp {} debs/ \;
          if ! ls debs/*.deb >/dev/null 2>&1; then echo "::error::no .deb found in artifacts"; exit 1; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$APT_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$APT_KNOWN_HOSTS" > ~/.ssh/known_hosts
          opt="-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o Port=${APT_PORT:-22} -i $HOME/.ssh/id_deploy"
          tmp=$(ssh $opt "$APT_HOST" mktemp -d)
          scp $opt -q packaging/apt/publish.sh debs/*.deb "$APT_HOST:$tmp/"
          ssh $opt "$APT_HOST" bash -s -- "$tmp" "$APT_REPO" "$APT_SUITE" <<'EOF'
          rc=0
          bash "$1/publish.sh" "$2" "$3" "$1"/*.deb || rc=$?
          rm -rf "$1"
          exit $rc
          EOF
